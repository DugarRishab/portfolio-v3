    <meta name="mobile-web-app-capable" content="yes" />

    <style>
      body {
        background-color: #050505;

      }

        background: #555;

      .glass-card {
        background: rgba(255, 255, 255, 0.03);

        border: 1px solid rgba(255, 255, 255, 0.05);
      }
